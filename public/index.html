<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>רישום הסעות ישיבת תפרח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--navy:#1A3555;--navy-mid:#22477A;--accent:#2563EB;--accent-dim:#DBEAFE;--sky:#F0F6FF;--white:#FFFFFF;--g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;--g600:#475569;--g900:#0F172A;--green:#166534;--green-bg:#DCFCE7;--red:#991B1B;--red-bg:#FEE2E2;--amber:#92400E;--amber-bg:#FEF3C7;--bg:var(--sky);--surface:var(--white);--text:var(--g900);--muted:var(--g600);--border:var(--g200)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1829;--surface:#112240;--text:#CBD5E0;--muted:#64748B;--border:#1E3A5C;--sky:#0B1829;--g50:#0D1B2E;--g100:#112240;--g200:#1E3A5C;--white:#112240;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1829;--surface:#112240;--text:#CBD5E0;--muted:#64748B;--border:#1E3A5C;--sky:#0B1829;--g50:#0D1B2E;--g100:#112240;--g200:#1E3A5C;--white:#112240;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Assistant',system-ui,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5}
#top-bar{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.bar-inner{max-width:1400px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;gap:12px}
.brand{font-size:17px;font-weight:800;flex:0 0 auto}
.brand small{font-size:12px;font-weight:400;opacity:.65;margin-right:6px}
.bar-center{flex:1;display:flex;align-items:center;justify-content:center}
#refresh-bar{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.85}
#countdown-ring{width:30px;height:30px;flex-shrink:0}
#countdown-ring svg{transform:rotate(-90deg)}
#ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:3}
#ring-fg{fill:none;stroke:#7DD3FC;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .9s linear;stroke-dasharray:75.4}
.bar-end{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%}
.dot.gray{background:#94A3B8}.dot.pulse{background:#FCD34D;animation:blink .8s infinite alternate}
.dot.ok{background:#6EE7B7}.dot.err{background:#FCA5A5}
@keyframes blink{to{opacity:.3}}
#status-lbl{font-size:13px;opacity:.8}
.btn-refresh{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-family:inherit;cursor:pointer}
.btn-refresh:hover{background:rgba(255,255,255,.25)}
#body{max-width:1400px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
.alert{padding:12px 16px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.info{background:var(--accent-dim);color:#1E40AF;border:1px solid #93C5FD}
.alert.success{background:var(--green-bg);color:var(--green);border:1px solid #86EFAC}
.alert.warning{background:var(--amber-bg);color:var(--amber);border:1px solid #FCD34D}
.alert.error{background:var(--red-bg);color:var(--red);border:1px solid #FCA5A5}
.alert strong{display:block;margin-bottom:2px}
code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px;font-size:12px}
#cfg-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #FCD34D;border-radius:10px;padding:12px 16px;font-size:14px}
#cfg-warn strong{display:block;margin-bottom:4px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.section-meta{font-size:13px;color:var(--muted)}
#city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.city-card{border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;border:2px solid transparent}
.city-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.city-card:active{transform:scale(.97)}
.city-count{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.city-name{font-size:13px;font-weight:600;opacity:.85;word-break:break-word}
.city-pct{position:absolute;bottom:6px;left:10px;font-size:11px;opacity:.55}
.bar-bg{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.25)}
.bar-fill{position:absolute;bottom:0;left:0;height:4px;background:rgba(255,255,255,.6);border-radius:0 2px 2px 0}
.cc0{background:#2563EB;color:#fff}.cc1{background:#7C3AED;color:#fff}.cc2{background:#DB2777;color:#fff}
.cc3{background:#DC2626;color:#fff}.cc4{background:#D97706;color:#fff}.cc5{background:#059669;color:#fff}
.cc6{background:#0891B2;color:#fff}.cc7{background:#4338CA;color:#fff}.cc8{background:#BE185D;color:#fff}
.cc9{background:#92400E;color:#fff}.cc10{background:#047857;color:#fff}.cc11{background:#0E7490;color:#fff}
.city-card-total{background:var(--g100);color:var(--text);border:2px solid var(--border);cursor:default}
.city-card-total:hover{transform:none;box-shadow:none}
#drill-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn-back{display:flex;align-items:center;gap:6px;background:var(--g100);border:1.5px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn-back:hover{background:var(--g200)}
.drill-title{font-size:19px;font-weight:800;flex:1}
.drill-count{font-size:13px;color:var(--muted)}
#nbhd-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.nbhd-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--g100);border:1.5px solid var(--border);font-size:13px;cursor:pointer;white-space:nowrap}
.nbhd-chip:hover{background:var(--g200)}
.nbhd-chip .n-count{font-weight:700;color:var(--accent)}
.nbhd-chip.active{background:var(--accent-dim);border-color:#93C5FD;color:#1E40AF}
.nbhd-chip.active .n-count{color:#1E40AF}
.search-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search-box{position:relative;flex:1;min-width:160px}
.search-box input{width:100%;height:36px;padding:0 36px 0 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;direction:rtl;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.tbl-info{font-size:13px;color:var(--muted)}
.btn-export{background:var(--accent-dim);color:var(--accent);border:1.5px solid #93C5FD;padding:6px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn-export:hover{background:#BFDBFE}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:500px}
thead th{background:var(--g50);padding:9px 12px;text-align:right;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;border-bottom:1.5px solid var(--border);cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
.sort-ico{margin-right:3px;font-size:9px;opacity:.5}
thead th.sorted .sort-ico{opacity:1}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--g50)}
tbody td{padding:8px 12px;vertical-align:middle;font-variant-numeric:tabular-nums}
tbody td.phone{direction:ltr;text-align:right;font-family:'Courier New',monospace;font-size:13px;color:var(--muted)}
tbody td.idx{color:var(--muted);font-size:12px;text-align:left}
.pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.pager-btns{display:flex;gap:4px}
.pager-btns button{width:30px;height:30px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer}
.pager-btns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager-btns button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager-btns button:disabled{opacity:.3;cursor:not-allowed}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ico{font-size:40px;margin-bottom:8px}
/* ══════════ מובייל ══════════ */
@media(max-width:640px){
  /* סרגל עליון */
  .bar-inner{padding:0 12px;height:50px;gap:8px}
  .brand{font-size:14px}
  #refresh-label{display:none}
  #countdown-ring{width:26px;height:26px}
  #status-lbl{display:none}
  .btn-refresh{padding:4px 9px;font-size:11px}
  /* גוף */
  #body{padding:10px 10px 80px;gap:10px}
  .section{padding:12px 12px;border-radius:12px}
  .section-head{margin-bottom:10px}
  .section-title{font-size:11px}
  /* כרטיסי ערים */
  #city-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  #nbhd-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px}
  .city-count{font-size:26px}
  .city-name{font-size:12px}
  /* כפתור חזרה בתחתית (sticky) */
  .btn-back{position:fixed;bottom:16px;right:16px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.25);border-radius:24px;padding:10px 20px;font-size:15px;background:var(--navy);color:#fff;border-color:transparent}
  /* כותרת drill */
  #drill-header{flex-direction:row-reverse;justify-content:flex-end}
  .drill-title{font-size:17px}
  /* טבלה — כרטיסים במקום שורות */
  table,thead,tbody,th,td,tr{display:block}
  thead tr{position:absolute;top:-9999px;right:-9999px}
  tbody tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:10px 12px;background:var(--surface)}
  tbody tr:hover{background:var(--g50)}
  tbody td{border:none;padding:3px 0;font-size:13px;display:flex;gap:6px;align-items:baseline}
  tbody td::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:700;min-width:70px;flex-shrink:0}
  tbody td.idx{display:none}
  tbody td.phone{direction:ltr;justify-content:flex-end}
  /* חיפוש + ייצוא */
  .search-row{flex-direction:column;align-items:stretch}
  .btn-export{width:100%;text-align:center}
  /* עמודות */
  .pager{flex-direction:column;align-items:center;gap:6px}
  .pager-btns button{width:36px;height:36px;font-size:15px}
  /* עוגה */
  #pie-wrap,#nbhd-pie-wrap,#ramot-pie-wrap{flex-direction:column;align-items:center;gap:16px}
  /* רמות */
  #ramot-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px}
}
</style>
</head>
<body>

<header id="top-bar">
  <div class="bar-inner">
    <div class="brand">🚌 <span>רישום הסעות ישיבת תפרח</span></div>
    <div class="bar-center">
      <div id="refresh-bar">
        <div id="countdown-ring"><svg width="30" height="30" viewBox="0 0 30 30"><circle id="ring-bg" cx="15" cy="15" r="12"/><circle id="ring-fg" cx="15" cy="15" r="12" stroke-dashoffset="0"/></svg></div>
        <span id="refresh-label">ריענון עוד <b id="cd-num">10</b> שנ'</span>
        <button class="btn-refresh" onclick="togglePause()" id="btn-pause">⏸ השהה</button>
        <button class="btn-refresh" onclick="manualRefresh()">🔄 רענן</button>
      </div>
    </div>
    <div class="bar-end"><span id="dot" class="dot gray"></span><span id="status-lbl">לא מחובר</span></div>
  </div>
</header>

<div id="body">
  <div id="cfg-warn" hidden style="background:var(--amber-bg);color:var(--amber);border:1px solid #FCD34D;border-radius:10px;padding:12px 16px;font-size:14px"><strong>⚙️ עדכן פרטי כניסה</strong> ערוך את הקובץ ועדכן <code>sysNum</code> ו-<code>password</code>.</div>

  <div id="view-dashboard">
    <div class="section">
      <div class="section-head"><span class="section-title">סיכום לפי ערים</span><span id="dash-meta" class="section-meta"></span></div>
      <div id="city-grid"><div class="empty"><div class="ico">🏙️</div><p>טוען נתונים…</p></div></div>
    </div>
    <div class="section" id="pie-section" hidden>
      <div class="section-head"><span class="section-title">התפלגות לפי עיר</span></div>
      <div id="pie-wrap" style="display:flex;align-items:center;gap:32px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div id="view-city" hidden>
    <div class="section">
      <div id="drill-header">
        <button class="btn-back" onclick="backToDash()">← חזרה לסיכום</button>
        <div><div class="drill-title" id="drill-title"></div><div class="drill-count" id="drill-count"></div></div>
      </div>
    </div>
    <div class="section" id="nbhd-section" hidden>
      <div class="section-head"><span class="section-title">סיכום לפי שכונות</span><span id="nbhd-meta" class="section-meta"></span></div>
      <div id="nbhd-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px"></div>
      <div id="nbhd-pie-wrap" style="display:flex;align-items:center;gap:32px;flex-wrap:wrap"></div>
    </div>
    <div class="section" id="ramot-section" hidden>
      <div class="section-head"><span class="section-title">📍 בתוך רמות</span><span id="ramot-meta" class="section-meta"></span></div>
      <div id="ramot-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px"></div>
      <div id="ramot-pie-wrap" style="display:flex;align-items:center;gap:32px;flex-wrap:wrap"></div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-title">רשימת רשומות</span></div>
      <div class="search-row">
        <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="search-in" placeholder="חיפוש…" oninput="applyDrillFilter()"></div>
        <span id="list-info" class="tbl-info"></span>
        <button class="btn-export" onclick="exportCSV()">⬇ ייצא CSV</button>
      </div>
      <div class="tbl-wrap"><table><thead id="drill-thead"></thead><tbody id="drill-tbody"></tbody></table></div>
      <div class="pager"><span id="page-info"></span><div class="pager-btns" id="page-btns"></div></div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  שנה כאן את פרטי הכניסה
// ════════════════════════════════════════════
const CONFIG={
  sysNum:   '033050999',
  password: '556778',
  folder:   '2/4',     // שלוחה
  refreshSec: 10
};
// ════════════════════════════════════════════
// מיפוי שדות מ-ApprovalAll.ini
// P050 = עיר, P051 = כמות מקומות שהוזמנו לאותה עיר
// ════════════════════════════════════════════
const FIELD_LABELS={
  'P050': 'עיר',
  'P051': 'כמות מקומות'
};
// ערים: P050+N
const CITY_MAP={
  '1':'ירושלים','2':'בני ברק','3':'בית שמש',
  '4':'מודיעין עילית','5':'ביתר','6':'אלעד'
};

const API='https://private.call2all.co.il/ym/api/';
let _token=null,_tokenAt=0,_records=[],_columns=[];
// שדות קבועים לפי ApprovalAll.ini
const CITY_KEY='P050';
const QTY_KEY='P051'; // כמות מקומות שהוזמנו
let _activeCity=null,_drillFiltered=[],_drillPage=1;
let _drillSort=null,_drillSortAsc=true,_timerInterval=null,_cdCount=CONFIG.refreshSec,_paused=false;
const PAGE_SIZE=50;
const COL_CLS=['cc0','cc1','cc2','cc3','cc4','cc5','cc6','cc7','cc8','cc9','cc10','cc11'];
// ═══ הקלטות: נשמרות בתת-שלוחה "Record", בשם קובץ כמו:
// OK-שמחת בית השואבה תשפז-1120-Phone-0548507931-Date-2026-09-27-01-08-19-Data-P050-1-P051-4.wav
// הרשימה נשלפת רק בלחיצה על "השמע" (לא בכל רענון), ונשמרת בזיכרון לשימוש חוזר.
// ═══
let _recordingMap=null;
function parseRecordingFilename(name){
  const info={};
  const phoneM=name.match(/-Phone-(\d+)-/);
  if(phoneM)info.phone=phoneM[1];
  const dataM=name.match(/-Data-(.+)\.\w+$/i);
  if(dataM){
    const parts=dataM[1].split('-');
    for(let i=0;i+1<parts.length;i+=2){
      if(/^P\d{2,3}$/i.test(parts[i]))info[parts[i].toUpperCase()]=parts[i+1];
    }
  }
  return info;
}
function recordingKey(phone,p050,p051){return `${phone}|${p050}|${p051}`}
async function ensureRecordingMap(force){
  if(_recordingMap&&!force)return _recordingMap;
  const map=new Map();
  const{files}=await getDir(`${CONFIG.folder}/Record`);
  for(const f of files){
    if(!f||!/\.(wav|mp3|amr|gsm|marc)$/i.test(f))continue;
    const info=parseRecordingFilename(f);
    if(info.phone&&info[CITY_KEY]&&info[QTY_KEY]){
      map.set(recordingKey(info.phone,info[CITY_KEY],info[QTY_KEY]),f);
    }
  }
  _recordingMap=map;
  return map;
}

// ═══ פענוח WAV טלפוני (G.711 A-law/µ-law) לצליל שדפדפנים יודעים לנגן ═══
function alaw2linear(a){
  a^=0x55;
  let t=(a&0x0f)<<4;
  const seg=(a&0x70)>>4;
  if(seg===0)t+=8;else if(seg===1)t+=0x108;else{t+=0x108;t<<=(seg-1)}
  return(a&0x80)?t:-t;
}
function ulaw2linear(u){
  const BIAS=0x84;
  u=(~u)&0xFF;
  let t=((u&0x0f)<<3)+BIAS;
  t<<=(u&0x70)>>4;
  return(u&0x80)?(BIAS-t):(t-BIAS);
}
function parseWavHeader(buf){
  const dv=new DataView(buf);
  if(buf.byteLength<12||dv.getUint32(0,false)!==0x52494646||dv.getUint32(8,false)!==0x57415645)return null;
  let offset=12,fmt=null,dataOffset=-1,dataLength=0;
  while(offset+8<=buf.byteLength){
    const id=dv.getUint32(offset,false),size=dv.getUint32(offset+4,true),body=offset+8;
    if(id===0x666d7420)fmt={audioFormat:dv.getUint16(body,true),numChannels:dv.getUint16(body+2,true),sampleRate:dv.getUint32(body+4,true),bitsPerSample:dv.getUint16(body+14,true)};
    else if(id===0x64617461){dataOffset=body;dataLength=size}
    offset=body+size+(size%2);
  }
  if(!fmt||dataOffset<0)return null;
  return{fmt,dataOffset,dataLength};
}
function writeStr(dv,offset,str){for(let i=0;i<str.length;i++)dv.setUint8(offset+i,str.charCodeAt(i))}
function pcmToWavBlob(pcm,sampleRate,numChannels){
  const blockAlign=numChannels*2,dataSize=pcm.length*2;
  const buf=new ArrayBuffer(44+dataSize),dv=new DataView(buf);
  writeStr(dv,0,'RIFF');dv.setUint32(4,36+dataSize,true);writeStr(dv,8,'WAVE');
  writeStr(dv,12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,numChannels,true);dv.setUint32(24,sampleRate,true);
  dv.setUint32(28,sampleRate*blockAlign,true);dv.setUint16(32,blockAlign,true);dv.setUint16(34,16,true);
  writeStr(dv,36,'data');dv.setUint32(40,dataSize,true);
  let off=44;for(let i=0;i<pcm.length;i++,off+=2)dv.setInt16(off,pcm[i],true);
  return new Blob([buf],{type:'audio/wav'});
}
// ממיר buffer של קובץ WAV טלפוני (A-law/µ-law/PCM 8-bit) ל-Blob URL שדפדפן יודע לנגן
function wavToPlayableUrl(buf){
  const parsed=parseWavHeader(buf);
  if(!parsed)return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  const{fmt,dataOffset,dataLength}=parsed;
  if(fmt.audioFormat===1&&fmt.bitsPerSample===16)return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  const src=new Uint8Array(buf,dataOffset,dataLength);
  let decode;
  if(fmt.audioFormat===6)decode=alaw2linear;
  else if(fmt.audioFormat===7)decode=ulaw2linear;
  else if(fmt.audioFormat===1&&fmt.bitsPerSample===8)decode=v=>(v-128)<<8;
  else throw new Error('פורמט קובץ לא נתמך (audioFormat='+fmt.audioFormat+')');
  const pcm=new Int16Array(src.length);
  for(let i=0;i<src.length;i++)pcm[i]=decode(src[i]);
  return URL.createObjectURL(pcmToWavBlob(pcm,fmt.sampleRate,fmt.numChannels||1));
}

async function ensureToken(){
  if(_token&&Date.now()-_tokenAt<25*60*1000)return _token;
  setStatus('pulse','מתחבר…');
  let text;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(`${API}Login?username=${encodeURIComponent(CONFIG.sysNum)}&password=${encodeURIComponent(CONFIG.password)}`,{signal:ctrl.signal});
    clearTimeout(tid);
    text=await res.text();
  }catch(e){
    const msg=e.name==='AbortError'?'פג זמן ההמתנה לשרת (8 שנ\')':('שגיאת רשת/CORS: '+e.message);

    qs('city-grid').innerHTML=`<div class="empty"><div class="ico">⏱️</div><p style="color:#DC2626">${msg}</p><p style="font-size:12px">ודא שהקובץ נפתח כ-file:// ולא מ-localhost</p></div>`;
    throw new Error(msg);
  }
  let tok=null;
  try{const j=JSON.parse(text);if(j.token)tok=j.token;else if(j.responseStatus&&j.responseStatus!=='OK')throw new Error(j.message||text)}catch(e){if(e.message.includes('JSON')){}else throw e}
  if(!tok){const m=text.match(/token[=:"]+([A-Za-z0-9+\/=_\-]{4,})/);if(m)tok=m[1]}
  if(!tok)throw new Error('כניסה נכשלה: '+text.slice(0,150));
  _token=tok;_tokenAt=Date.now();setStatus('ok','מחובר');return _token;
}

async function downloadFile(path,timeoutMs=15000){
  const tok=await ensureToken();
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
    const r=await fetch(`${API}DownloadFile?token=${tok}&path=ivr2:${path}`,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok)return null;
    const t=await r.text();
    return(t&&!t.includes('"responseStatus":"ERROR"'))?t:null;
  }catch{return null}
}
// משמיע קובץ הקלטה מתת-השלוחה Record — הרשימה נשלפת רק בלחיצה (ensureRecordingMap)
async function playRecording(phone,p050,p051,btn){
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent='⏳ מחפש…';
  try{
    let map=await ensureRecordingMap();
    let filename=map.get(recordingKey(phone,p050,p051));
    if(!filename){
      map=await ensureRecordingMap(true); // אולי ההקלטה נוספה זה עתה — נסה רשימה טרייה
      filename=map.get(recordingKey(phone,p050,p051));
    }
    if(!filename){
      btn.disabled=false;btn.textContent=orig;
      alert('לא נמצאה הקלטה תואמת עבור הזמנה זו');
      return;
    }
    btn.textContent='⏳ טוען…';
    const tok=await ensureToken();
    const url=`${API}DownloadFile?token=${tok}&path=ivr2:${CONFIG.folder}/Record/${encodeURIComponent(filename)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error('שגיאת הורדה ('+res.status+')');
    const buf=await res.arrayBuffer();
    const blobUrl=wavToPlayableUrl(buf);
    const audio=new Audio(blobUrl);
    audio.addEventListener('ended',()=>{btn.disabled=false;btn.textContent=orig;URL.revokeObjectURL(blobUrl)});
    audio.addEventListener('error',()=>{btn.disabled=false;btn.textContent=orig;URL.revokeObjectURL(blobUrl);alert('לא ניתן להשמיע את ההקלטה (פורמט לא נתמך בדפדפן)')});
    await audio.play();
    btn.disabled=false;btn.textContent='⏸ מתנגן…';
  }catch(e){
    btn.disabled=false;btn.textContent=orig;
    alert('שגיאה בהשמעת ההקלטה: '+e.message);
  }
}
async function getDir(path){
  const tok=await ensureToken();
  try{return parseDirText(await(await fetch(`${API}GetIVR2Dir?token=${tok}&path=ivr2:${path}`)).text())}
  catch{return{folders:[],files:[]}}
}
function parseDirText(text){
  if(!text||text.includes('"responseStatus":"ERROR"'))return{folders:[],files:[]};
  try{
    const j=JSON.parse(text);
    if(j.files){return{
      folders:j.files.filter(f=>f.isFolder||f.type==='d').map(f=>f.name||f),
      files:j.files.filter(f=>!f.isFolder&&f.type!=='d').map(f=>f.name||f)
    }}
  }catch{}
  const folders=[],files=[];
  for(const line of text.split('\n')){
    const t=line.trim();if(!t)continue;
    if(t.includes('type=d')||t.endsWith('/'))folders.push(t.replace(/\/$|type=d.*$/,'').replace(/^name=/,'').trim());
    else if(t.includes('.')||t.includes('type=f'))files.push(t.replace(/type=f.*$/,'').replace(/^name=/,'').trim());
    else if(t.length>1)folders.push(t);
  }
  return{folders,files};
}

// פרסר ייעודי ל-ApprovalAll.ymgr
// פורמט: Status#OK%Phone#05X%P050#1%ValName#שם
function parseApprovalAll(text){
  const recs=[];
  for(const line of text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')){
    const tr=line.trim();if(!tr||tr.startsWith('{'))continue;
    const rec={};
    for(const part of tr.split('%')){
      const i=part.indexOf('#');if(i<=0)continue;
      const k=part.slice(0,i).trim(),v=part.slice(i+1).trim();
      if(k)rec[k]=v;
    }
    if(Object.keys(rec).length>0)recs.push(rec);
  }
  return recs;
}

function parseYMGR(text){
  const recs=[];
  for(const line of text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')){
    const tr=line.trim();if(!tr||tr.startsWith('{'))continue;
    const rec={};
    for(const p of(tr.includes('\t')?tr.split('\t'):tr.split(' '))){
      const i=p.indexOf('#');
      if(i>0){
        const k=p.slice(0,i).trim(),v=p.slice(i+1).trim();
        if(!k)continue;
        if(k.length<=12&&/^[A-Za-z0-9_]+$/.test(k)){
          // שדה רגיל: Phone, Date, P050 וכו'
          rec[k]=v;
        } else if(k.length<80){
          const combined=k+'#'+v;
          // פורמט Log: P050%Log#2
          for(const [,num,val] of combined.matchAll(/P0(\d{2,3})%Log#(\w+)/g)){rec[`P0${num}`]=val}
          // פורמט Approval: %P050#1
          for(const [,num,val] of combined.matchAll(/%P0(\d{2,3})#([^%\s]+)/g)){rec[`P0${num}`]=val}
        }
      }
    }
    if(Object.keys(rec).length>0)recs.push(rec);
  }
  return recs;
}

function buildColumns(records){
  const keys=[...new Set(records.flatMap(r=>Object.keys(r)))];
  // עמודות מועדפות קודם
  const prio=['ValName','Phone','Date',CITY_KEY,QTY_KEY,'Status','Booking'];
  const hidden=['_path','_period','DID','IncomingDID','var','IdType','Data','Folder','HebrewDate','Time','EnterId','IdType'];
  _columns=keys.filter(k=>!hidden.includes(k));
  _columns.sort((a,b)=>{const ai=prio.indexOf(a),bi=prio.indexOf(b);
    if(ai<0&&bi<0)return a.localeCompare(b,'he');if(ai<0)return 1;if(bi<0)return-1;return ai-bi});
}

// ערך מוצג של רשומה בעמודה (עם תרגום לעברית)
function cellVal(rec,col){
  const v=rec[col]??'';
  if(col===CITY_KEY)return cityLabel(v);
  return v;
}

async function loadData(){
  if(!credsOK()){qs('cfg-warn').hidden=false;return}
  clearAlert();

  try{
    const folder=CONFIG.folder;
    let found=[];

    const setLoading=msg=>{
      qs('city-grid').innerHTML=`<div class="empty"><div class="ico">⏳</div><p>${msg}</p></div>`;
    };

    // ── ניסיון 1: ApprovalAll.ymgr — קובץ הרשמות (רשומה אחת לכל מתקשר) ──
    setLoading('מוריד ApprovalAll.ymgr…');
    const approvalPath=`${folder}/ApprovalAll.ymgr`;
    const approvalText=await downloadFile(approvalPath,12000);
    if(approvalText&&approvalText.trim().length>5&&!approvalText.trim().startsWith('<')){
      setLoading('מפרסר ApprovalAll.ymgr…');
      const firstLines=approvalText.split('\n').slice(0,5).join('\n');
      console.log('ApprovalAll.ymgr raw:\n'+firstLines);
      window._rawSample=firstLines; // שמור לתצוגה
      const recs=parseApprovalAll(approvalText);
      if(recs.length){recs.forEach(r=>{r._path=approvalPath});found.push(...recs)}
    }

    // ── ניסיון 2: אם לא מצאנו — טען LogRecordingAndEnteringData.ymgr ──
    if(!found.length){
      setLoading('מוריד LogRecordingAndEnteringData.ymgr…');
      const logPath=`${folder}/LogRecordingAndEnteringData.ymgr`;
      const logText=await downloadFile(logPath,30000);
      if(logText&&logText.trim().length>5){
        setLoading('מפרסר נתוני Log…');
        const recs=parseYMGR(logText);
        if(recs.length){recs.forEach(r=>{r._path=logPath});found.push(...recs)}
      }
    }

    // ── ניסיון 3: גלישת תיקייה ──
    if(!found.length){
      setLoading('מחפש קבצים בתיקייה…');
      const{files}=await getDir(folder);
      for(const f of files.filter(f=>f&&f.toLowerCase().endsWith('.ymgr'))){
        setLoading(`מוריד ${f}…`);
        const text=await downloadFile(`${folder}/${f}`);
        if(text&&text.trim().length>5){
          const recs=parseYMGR(text);
          if(recs.length){recs.forEach(r=>{r._path=`${folder}/${f}`});found.push(...recs)}
        }
      }
    }
    if(!found.length){
      showAlert('warning','לא נמצאו נתונים',`לא מצאנו קבצי YMGR בשלוחה ${folder}.`);
      qs('city-grid').innerHTML='<div class="empty"><div class="ico">📭</div><p>אין נתונים</p></div>';
      return;
    }
    const sample=found[0]||{};
    const sampleKeys=Object.keys(sample);
    console.log('שדות דגימה:',sampleKeys,'ערך ראשון:',JSON.stringify(sample));
    // ApprovalAll.ymgr — כל רשומה כבר ייחודית (אחת לנרשם); רק ב-Log נייחד לפי טלפון
    const isApproval=found[0]?._path?.toLowerCase().includes('approvalall');
    if(isApproval){
      _records=found; // כבר ייחודי
    } else {
      const phoneKey=r=>r['_phone']||r['Folder']||r['Phone']||r['phone']||r['DID']||r['IncomingDID']||'';
      const byPhone=new Map();
      for(const r of found){const p=phoneKey(r);if(p)byPhone.set(p,r);else byPhone.set(Symbol(),r)}
      _records=[...byPhone.values()];
    }
    buildColumns(_records);
    renderDashboard();
  }catch(e){console.error(e);if(e.message.includes('CORS')||e.message.includes('network')||e.message.includes('Failed to fetch')){qs('cors-tip').hidden=false}else{setStatus('err',e.message.slice(0,40))}qs('city-grid').innerHTML=`<div class="empty"><div class="ico">❌</div><p>${esc(e.message)}</p></div>`}
}

function renderMiniPie(items,containerId){
  const el=qs(containerId);if(!el)return;
  const total=items.reduce((s,[,n])=>s+n,0);if(!total){el.innerHTML='';return}
  const COLORS=['#2563EB','#7C3AED','#DB2777','#DC2626','#D97706','#059669','#0891B2','#4338CA','#BE185D','#92400E','#047857','#0E7490'];
  const R=75,cx=90,cy=90,size=180;
  let angle=-Math.PI/2,paths='',legendHtml='';
  items.forEach(([name,count],i)=>{
    const slice=count/total*Math.PI*2;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    angle+=slice;
    const x2=cx+R*Math.cos(angle),y2=cy+R*Math.sin(angle);
    const large=slice>Math.PI?1:0;
    const col=COLORS[i%COLORS.length];
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    const pct=Math.round(count/total*100);
    legendHtml+=`<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px">
      <span style="width:11px;height:11px;border-radius:3px;background:${col};flex-shrink:0"></span>
      <span style="font-weight:600">${esc(name)}</span>
      <span style="color:var(--muted)">${count.toLocaleString('he')} (${pct}%)</span></div>`;
  });
  el.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="max-width:180px;flex-shrink:0">${paths}</svg><div>${legendHtml}</div>`;
}
function renderPieChart(cities){
  if(!cities.length){qs('pie-section').hidden=true;return}
  qs('pie-section').hidden=false;
  renderMiniPie(cities,'pie-wrap');
}

// סכום "כמות מקומות" (P051) וספירת הזמנות, מקובצים לפי עיר
function getCityStats(recs){
  const m={};
  for(const r of recs){
    const c=cityLabel(r[CITY_KEY]);
    const qty=parseInt(r[QTY_KEY],10)||0;
    if(!m[c])m[c]={seats:0,orders:0};
    m[c].seats+=qty;m[c].orders+=1;
  }
  return Object.entries(m).map(([city,v])=>({city,seats:v.seats,orders:v.orders})).sort((a,b)=>b.seats-a.seats);
}

function renderDashboard(){
  const allCities=getCityStats(_records);
  const cities=allCities.filter(c=>c.city!=='(לא ידוע)');
  const unknown=allCities.find(c=>c.city==='(לא ידוע)');
  const totalSeats=allCities.reduce((s,c)=>s+c.seats,0);
  const totalOrders=_records.length;
  qs('dash-meta').textContent=`${totalSeats.toLocaleString('he')} מקומות · ${totalOrders.toLocaleString('he')} הזמנות · ${cities.length} ערים`;
  const maxSeats=cities[0]?.seats||1;
  let html=`<div class="city-card city-card-total" onclick="drillAll()" style="cursor:pointer">
    <div class="city-count">${totalSeats.toLocaleString('he')}</div>
    <div class="city-name">סה"כ מקומות שהוזמנו</div>
    <div class="city-pct">${totalOrders.toLocaleString('he')} הזמנות${unknown?` · ${unknown.seats.toLocaleString('he')} ללא עיר`:''}</div>
  </div>`;
  cities.forEach((c,i)=>{
    const fw=Math.round(c.seats/maxSeats*100);
    html+=`<div class="city-card ${COL_CLS[i%12]}" data-city="${esc(c.city)}" onclick="drillCity(this.dataset.city)">
      <div class="city-count">${c.seats.toLocaleString('he')}</div>
      <div class="city-name">${esc(c.city)}</div>
      <div class="city-pct">${c.orders.toLocaleString('he')} הזמנות</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${fw}%"></div></div>
    </div>`;
  });
  qs('city-grid').innerHTML=html;
  renderPieChart(cities.map(c=>[c.city,c.seats]));
}

function drillCity(raw){
  const city=raw.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  _activeCity=city;_drillPage=1;_drillSort=null;_drillSortAsc=true;
  qs('search-in').value='';
  const cityRecs=_records.filter(r=>cityLabel(r[CITY_KEY])===city);
  const seats=cityRecs.reduce((s,r)=>s+(parseInt(r[QTY_KEY],10)||0),0);
  qs('drill-title').textContent=city;
  qs('drill-count').textContent=`${seats.toLocaleString('he')} מקומות · ${cityRecs.length.toLocaleString('he')} הזמנות`;
  qs('nbhd-section').hidden=true;
  qs('ramot-section').hidden=true;
  qs('view-dashboard').hidden=true;qs('view-city').hidden=false;
  applyDrillFilter();
}
function applyDrillFilter(){
  let base=_activeCity==='__all__'?_records:_records.filter(r=>cityLabel(r[CITY_KEY])===_activeCity);
  const q=(qs('search-in').value||'').toLowerCase();
  _drillFiltered=q?base.filter(r=>_columns.some(c=>String(cellVal(r,c)).toLowerCase().includes(q))):base;
  renderDrillTable();
}
function renderDrillTable(){
  let rows=[..._drillFiltered];
  if(_drillSort)rows.sort((a,b)=>{
    const av=cellVal(a,_drillSort),bv=cellVal(b,_drillSort);
    const c=av<bv?-1:av>bv?1:0;return _drillSortAsc?c:-c
  });
  const total=rows.length,pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  _drillPage=Math.max(1,Math.min(_drillPage,pages));
  const start=(_drillPage-1)*PAGE_SIZE,pageRows=rows.slice(start,start+PAGE_SIZE);
  qs('drill-thead').innerHTML='<tr><th class="idx" style="width:36px">#</th>'+
    _columns.map(c=>{const s=_drillSort===c;return`<th class="${s?'sorted':''}" onclick="sortDrill('${c.replace(/'/g,"\\'")}')">
      ${esc(colLabel(c))}<span class="sort-ico">${s?(_drillSortAsc?'▲':'▼'):'⇅'}</span></th>`}).join('')+'<th style="width:90px">הקלטה</th></tr>';
  qs('drill-tbody').innerHTML=pageRows.length
    ?pageRows.map((r,i)=>{
        const cells=_columns.map(c=>{
          const v=cellVal(r,c);
          const cls=(c.toLowerCase().includes('phone')||c==='Folder')?'phone':'';
          return`<td class="${cls}" data-label="${esc(colLabel(c))}">${esc(v)}</td>`
        }).join('');
        const phoneRaw=String(r['Phone']||r['phone']||r['Folder']||'').trim();
        const jsSafe=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        const recCell=phoneRaw
          ?`<td data-label="הקלטה"><button class="btn-refresh" style="color:var(--accent);background:var(--accent-dim);border-color:#93C5FD" onclick="playRecording('${jsSafe(phoneRaw)}','${jsSafe(r[CITY_KEY]??'')}','${jsSafe(r[QTY_KEY]??'')}',this)">🔊 השמע</button></td>`
          :`<td data-label="הקלטה">—</td>`;
        return`<tr><td class="idx" data-label="#">${start+i+1}</td>${cells}${recCell}</tr>`;
      }).join('')
    :`<tr><td colspan="${_columns.length+2}" style="text-align:center;padding:30px;color:var(--muted)">אין תוצאות</td></tr>`;
  qs('list-info').textContent=`${total.toLocaleString('he')} רשומות`;
  qs('page-info').textContent=`עמוד ${_drillPage} / ${pages}`;
  const b=[`<button onclick="goPage(${_drillPage-1})" ${_drillPage<=1?'disabled':''}>›</button>`];
  const lo=Math.max(1,_drillPage-3),hi=Math.min(pages,_drillPage+3);
  if(lo>1)b.push(`<button onclick="goPage(1)">1</button>`);
  if(lo>2)b.push(`<button disabled>…</button>`);
  for(let i=lo;i<=hi;i++)b.push(`<button class="${i===_drillPage?'active':''}" onclick="goPage(${i})">${i}</button>`);
  if(hi<pages-1)b.push(`<button disabled>…</button>`);
  if(hi<pages)b.push(`<button onclick="goPage(${pages})">${pages}</button>`);
  b.push(`<button onclick="goPage(${_drillPage+1})" ${_drillPage>=pages?'disabled':''}>‹</button>`);
  qs('page-btns').innerHTML=b.join('');
}
function goPage(p){_drillPage=p;renderDrillTable()}
function sortDrill(col){if(_drillSort===col)_drillSortAsc=!_drillSortAsc;else{_drillSort=col;_drillSortAsc=true}renderDrillTable()}
function drillAll(){
  _activeCity='__all__';_drillPage=1;_drillSort=null;_drillSortAsc=true;
  qs('search-in').value='';
  const seats=_records.reduce((s,r)=>s+(parseInt(r[QTY_KEY],10)||0),0);
  qs('drill-title').textContent='כל הרשומות';
  qs('drill-count').textContent=`${seats.toLocaleString('he')} מקומות · ${_records.length.toLocaleString('he')} הזמנות`;
  qs('nbhd-section').hidden=true;
  qs('ramot-section').hidden=true;
  qs('view-dashboard').hidden=true;qs('view-city').hidden=false;
  _drillFiltered=_records;renderDrillTable();
}
function backToDash(){_activeCity=null;qs('view-city').hidden=true;qs('view-dashboard').hidden=false}

function exportCSV(){
  const e2=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const hdrs=_columns.map(c=>colLabel(c));
  const csv=[hdrs.map(c=>e2(c)).join(','),..._drillFiltered.map(r=>_columns.map(c=>e2(cellVal(r,c))).join(','))].join('\n');
  try{navigator.clipboard.writeText(csv).then(()=>showAlert('success','CSV הועתק ללוח',`${_drillFiltered.length} שורות — הדבק ב-Excel`),()=>fbCopy(csv))}catch{fbCopy(csv)}
}
function fbCopy(csv){const ta=document.createElement('textarea');ta.value=csv;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showAlert('success','CSV הועתק ללוח','')}catch{showAlert('info','לא הצליח','')}document.body.removeChild(ta)}

function updateRing(){
  const r=qs('ring-fg');
  if(r)r.style.strokeDashoffset=_paused?75.4:75.4*(1-_cdCount/CONFIG.refreshSec);
  const n=qs('cd-num');if(n)n.textContent=_paused?'—':_cdCount;
}
function togglePause(){
  _paused=!_paused;
  const btn=qs('btn-pause');
  const lbl=qs('refresh-label');
  if(_paused){
    btn.textContent='▶ המשך';
    if(lbl)lbl.innerHTML='<b>מושהה</b>';
  } else {
    btn.textContent='⏸ השהה';
    if(lbl)lbl.innerHTML=`ריענון עוד <b id="cd-num">${_cdCount}</b> שנ'`;
    _cdCount=CONFIG.refreshSec;
  }
  updateRing();
}
function startTimer(){
  _cdCount=CONFIG.refreshSec;updateRing();clearInterval(_timerInterval);
  _timerInterval=setInterval(async()=>{
    if(_paused)return;
    _cdCount--;if(_cdCount<=0){_cdCount=CONFIG.refreshSec;const prevCity=_activeCity;await loadData();if(prevCity)drillCity(prevCity)}
    updateRing();
  },1000);
}
async function manualRefresh(){_cdCount=CONFIG.refreshSec;updateRing();const prevCity=_activeCity;await loadData();if(prevCity)drillCity(prevCity)}

(async function(){
  if(!credsOK()){qs('cfg-warn').hidden=false;return}
  await loadData();startTimer();
})();
</script>
</body>
</html>
